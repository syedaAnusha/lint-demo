name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # caches node_modules for speed

      - name: Install dependencies
        run: npm ci # ci is faster and stricter than npm install

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit # catches TS errors without building

      - name: Build
        run: npm run build # if build fails, PR can't merge
